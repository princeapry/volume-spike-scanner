name: Volume Spike Scanner

on:
  # Jalan otomatis tiap jam di menit ke-2 (waktu UTC).
  # Menit ke-2 dipilih supaya candle 1 jam sebelumnya sudah pasti close.
  # Catatan: jadwal GitHub Actions bisa telat beberapa menit saat server ramai.
  schedule:
    - cron: "2 * * * *"
  # Bisa juga dijalankan manual dari tab Actions -> Run workflow
  workflow_dispatch:

# Cegah dua run berjalan bersamaan (misal run manual + terjadwal)
concurrency:
  group: volume-spike-scanner
  cancel-in-progress: false

# Dibutuhkan untuk menyimpan state dedup ke branch state-volume-spike
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ambil state dedup dari run sebelumnya
        continue-on-error: true   # run pertama: branch state-volume-spike belum ada
        uses: actions/checkout@v4
        with:
          ref: state-volume-spike
          path: scanner_state

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Jalankan scanner
        env:
          # Rahasia -> isi di Settings > Secrets and variables > Actions > Secrets
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Pengaturan opsional -> isi di tab "Variables" (kosong = pakai default)
          INTERVAL: ${{ vars.INTERVAL }}
          LOOKBACK: ${{ vars.LOOKBACK }}
          SPIKE_MULTIPLIER: ${{ vars.SPIKE_MULTIPLIER }}
          MIN_CANDLE_QUOTE_VOLUME: ${{ vars.MIN_CANDLE_QUOTE_VOLUME }}
          MIN_24H_QUOTE_VOLUME: ${{ vars.MIN_24H_QUOTE_VOLUME }}
          MAX_ALERTS: ${{ vars.MAX_ALERTS }}
          SEND_IF_EMPTY: ${{ vars.SEND_IF_EMPTY }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          BINANCE_BASE_URL: ${{ vars.BINANCE_BASE_URL }}
          # Ambang skor confluence (sama untuk kedua scanner, kosong = default)
          CONF_SPIKE_MULTIPLIER: ${{ vars.CONF_SPIKE_MULTIPLIER }}
          CONF_VOLUME_LOOKBACK: ${{ vars.CONF_VOLUME_LOOKBACK }}
          CONF_MIN_CANDLE_QUOTE_VOLUME: ${{ vars.CONF_MIN_CANDLE_QUOTE_VOLUME }}
          CONF_SWING_LOOKBACK: ${{ vars.CONF_SWING_LOOKBACK }}
          CONF_SWING_WINDOW: ${{ vars.CONF_SWING_WINDOW }}
          CONF_SUPPORT_DISTANCE_PCT: ${{ vars.CONF_SUPPORT_DISTANCE_PCT }}
          CONF_BUY_PRESSURE_PCT: ${{ vars.CONF_BUY_PRESSURE_PCT }}
          CONF_MIN_SCORE: ${{ vars.CONF_MIN_SCORE }}
          # Dedup antar-run (lihat alert_state.py).
          # Kosong = default 6 jam. Set 0 di tab Variables untuk mematikan.
          ALERT_COOLDOWN_HOURS: ${{ vars.ALERT_COOLDOWN_HOURS }}
          STATE_DIR: scanner_state
        run: python scanner.py

      - name: Simpan state dedup ke branch state-volume-spike
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd scanner_state 2>/dev/null || { echo "Folder state tidak ada, lewati."; exit 0; }
          ls *.json >/dev/null 2>&1 || { echo "Belum ada file state, lewati."; exit 0; }
          rm -rf .git
          git init -q
          git checkout -q -b "state-volume-spike"
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "state volume-spike $(date -u +%Y-%m-%dT%H:%MZ)"
          # Satu commit saja, ditimpa tiap run, supaya riwayat repo tidak membengkak
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "state-volume-spike"
          echo "State tersimpan di branch state-volume-spike."

      - name: Kabari Telegram kalau run ini gagal
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "text=[GAGAL] Volume Spike Scanner tidak selesai jalan. Cek log: ${RUN_URL}" \
            >/dev/null || true
