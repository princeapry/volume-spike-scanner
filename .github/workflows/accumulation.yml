name: Accumulation Scanner

on:
  # Jalan otomatis tiap 4 jam di menit ke-5 (waktu UTC): 00:05, 04:05, 08:05, ...
  # Candle 4h Binance tutup di jam 00, 04, 08, 12, 16, 20 UTC, jadi menit ke-5
  # memastikan candle 4h sebelumnya sudah close. Menit ke-5 (bukan ke-3)
  # supaya tidak barengan dengan Reversal Scanner.
  # (= 07:05, 11:05, 15:05, 19:05, 23:05, 03:05 WIB)
  # Catatan: kalau ACCUM_INTERVAL diganti (misal 1d), sesuaikan juga cron ini.
  # Jadwal GitHub Actions bisa telat beberapa menit saat server ramai.
  schedule:
    - cron: "5 */4 * * *"
  # Bisa juga dijalankan manual dari tab Actions -> Run workflow
  workflow_dispatch:

# Cegah dua run berjalan bersamaan (grup terpisah dari scanner lain)
concurrency:
  group: accumulation-scanner
  cancel-in-progress: false

# Dibutuhkan untuk menyimpan state dedup ke branch state-accumulation
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ambil state dedup dari run sebelumnya
        continue-on-error: true   # run pertama: branch state-accumulation belum ada
        uses: actions/checkout@v4
        with:
          ref: state-accumulation
          path: scanner_state

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Jalankan accumulation scanner
        env:
          # Rahasia -> sama dengan scanner lain (sudah ada)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Pengaturan khusus scanner ini -> tab "Variables" (kosong = pakai default)
          ACCUM_INTERVAL: ${{ vars.ACCUM_INTERVAL }}
          ACCUM_WINDOW: ${{ vars.ACCUM_WINDOW }}
          ACCUM_MAX_RANGE_PCT: ${{ vars.ACCUM_MAX_RANGE_PCT }}
          ACCUM_VOL_RISE_FACTOR: ${{ vars.ACCUM_VOL_RISE_FACTOR }}
          ACCUM_BASE_LOOKBACK: ${{ vars.ACCUM_BASE_LOOKBACK }}
          ACCUM_MAX_POSITION: ${{ vars.ACCUM_MAX_POSITION }}
          ACCUM_MAX_ALERTS: ${{ vars.ACCUM_MAX_ALERTS }}
          ACCUM_SEND_IF_EMPTY: ${{ vars.ACCUM_SEND_IF_EMPTY }}
          ACCUM_EXTRA_BLOCKLIST: ${{ vars.ACCUM_EXTRA_BLOCKLIST }}
          COMPRESS_RATIO: ${{ vars.COMPRESS_RATIO }}
          OI_RISE_FACTOR: ${{ vars.OI_RISE_FACTOR }}
          FUNDING_MAX: ${{ vars.FUNDING_MAX }}
          FUTURES_BASE_URL: ${{ vars.FUTURES_BASE_URL }}
          # Pengaturan bersama dengan scanner lain (universe pair & tampilan)
          MIN_24H_QUOTE_VOLUME: ${{ vars.MIN_24H_QUOTE_VOLUME }}
          MAX_ALERTS: ${{ vars.MAX_ALERTS }}
          SEND_IF_EMPTY: ${{ vars.SEND_IF_EMPTY }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          BINANCE_BASE_URL: ${{ vars.BINANCE_BASE_URL }}
          # Dedup antar-run (lihat alert_state.py).
          # Kosong = default 6 jam. Set 0 di tab Variables untuk mematikan.
          ALERT_COOLDOWN_HOURS: ${{ vars.ALERT_COOLDOWN_HOURS }}
          STATE_DIR: scanner_state
        run: python accumulation_scanner.py

      - name: Simpan state dedup ke branch state-accumulation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd scanner_state 2>/dev/null || { echo "Folder state tidak ada, lewati."; exit 0; }
          ls *.json >/dev/null 2>&1 || { echo "Belum ada file state, lewati."; exit 0; }
          rm -rf .git
          git init -q
          git checkout -q -b "state-accumulation"
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "state accumulation $(date -u +%Y-%m-%dT%H:%MZ)"
          # Satu commit saja, ditimpa tiap run, supaya riwayat repo tidak membengkak
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "state-accumulation"
          echo "State tersimpan di branch state-accumulation."

      - name: Kabari Telegram kalau run ini gagal
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "text=[GAGAL] Accumulation Scanner tidak selesai jalan. Cek log: ${RUN_URL}" \
            >/dev/null || true
