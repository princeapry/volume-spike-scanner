name: Alpha Snapshot TEST (sementara)
# Uji end-to-end: 2 run berturut-turut, dry-run (TANPA Telegram, tanpa secret),
# data ke branch alpha-data-test. Akan dihapus sebelum PR.
on:
  push:
    branches: [alpha-snapshot]
permissions:
  contents: write
concurrency:
  group: alpha-snapshot-test
  cancel-in-progress: false
env:
  DATA_BRANCH: alpha-data-test
jobs:
  run1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps: &steps
      - uses: actions/checkout@v4
      - id: data
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_BRANCH }}
          path: alpha_data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Jalankan (dry-run)
        env:
          ALPHA_DRY_RUN: "1"
          ALPHA_DATA_DIR: alpha_data
          TIMEZONE: Asia/Tokyo
        run: |
          mkdir -p alpha_data
          python alpha_snapshot.py
          echo "run_id=${{ github.run_id }} job=${{ github.job }} at $(date -u +%FT%TZ)" >> alpha_data/test_trace.txt
      - name: Simpan data
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd alpha_data
          [ -f state.json ] || { echo "no data"; exit 0; }
          rm -rf .git
          git init -q
          git checkout -q -b "$DATA_BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "test data"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$DATA_BRANCH"
  run2:
    needs: run1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps: *steps
